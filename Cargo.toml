[package]
name = "upong"
version = "0.2.0"
rust-version = "1.97.0"
edition = "2024"
license = "MIT"

description = "A simple pong game written completely from scratch in rust"
readme = "README.md"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3

[[bin]]
name = "upong"
path = "src/main.rs"

[dependencies]
bevy = "0.20.1"
